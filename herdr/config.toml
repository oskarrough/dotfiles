onboarding = false
[theme]
name = "gruvbox"
auto_switch = false

[update]
channel = "preview"

[ui.sidebar.agents]
rows = [["state_icon", "machine", "workspace", "tab"], ["pane"]]

# [ui.sidebar.spaces]
# rows = [["state_icon", "workspace"], ["branch", "$jj_status", "git_status"]]

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

[ui]
status_indicators = "symbols"

[ui.sound]
enabled = false
